<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Player check-in | Orbit</title>
    <link rel="icon" type="image/svg+xml" href="/orbit-logo.svg" />
    <link rel="stylesheet" href="/self-check-in.css" />
    <script src="/self-check-in.js" defer></script>
  </head>
  <body>
    <main id="check-in-app" class="check-in-shell" aria-busy="false">
      <header class="brand-header" aria-label="Orbit">
        <img src="/orbit-logo.svg" width="40" height="40" alt="" />
      </header>
      <section id="assistance-step" class="card terminal-card assistance-card" aria-labelledby="assistance-heading">
        <div class="result-icon" aria-hidden="true">i</div>
        <h1 id="assistance-heading" tabindex="-1">Printed self-check-in is unavailable</h1>
        <p id="assistance-message" class="lead">Sign in to Orbit Player and show your short-lived membership QR to venue staff.</p>
      </section>
      <noscript>
        <section class="card terminal-card assistance-card">
          <p class="lead">Please ask venue staff to check you in.</p>
        </section>
      </noscript>
    </main>
  </body>
</html>
