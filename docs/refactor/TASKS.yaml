rules:
  - complete tasks in dependency order
  - characterize risky behavior against the pre-refactor implementation
  - keep public and persisted contracts unchanged unless a separately approved task says otherwise
  - run focused checks and npm run verify before completing every production refactor task
  - commit each coherent checkpoint atomically and never push or deploy
  - continue independent work when one task is blocked
