name: Verify and Promote Desktop Release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      release_version:
        description: New immutable semver (for example 1.4.2)
        required: true
        type: string
      release_reason:
        description: Standard release or roll-forward rollback
        required: true
        default: standard
        type: choice
        options:
          - standard
          - rollback
      release_channel:
        description: Canary is promoted as a prerelease; stable is the normal channel
        required: true
        default: canary
        type: choice
        options:
          - canary
          - stable
      rollback_of:
        description: Version being superseded; required for rollback
        required: false
        type: string
      promote:
        description: Promote the verified artifact through the protected production-release environment
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  verify-and-package:
    name: Verify and package Windows artifact
    runs-on: windows-2025
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out the exact requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Validate immutable release inputs
        shell: pwsh
        run: |
          if ('${{ inputs.source_sha }}' -notmatch '^[0-9a-fA-F]{40}$') { throw 'source_sha must be an exact 40-character commit SHA.' }
          if ((git rev-parse HEAD).Trim() -ne '${{ inputs.source_sha }}') { throw 'Checked-out source does not match source_sha.' }
          if ('${{ inputs.release_version }}' -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'release_version must be an exact stable semver.' }
          if ('${{ inputs.release_reason }}' -eq 'rollback' -and '${{ inputs.rollback_of }}'.Length -eq 0) { throw 'rollback_of is required for a rollback release.' }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            player-app/package-lock.json
            apps/api/package-lock.json

      - name: Install locked dependencies
        run: |
          npm ci
          npm ci --prefix player-app
          npm ci --prefix apps/api

      - name: Apply the approved release version without a Git mutation
        run: npm version "${{ inputs.release_version }}" --no-git-tag-version

      - name: Run security, dependency, and release control gates
        run: |
          npm run security:paths
          npm run security:dependencies
          npm run check:release-controls
          npm run audit:module-graph

      - name: Run complete verification and production bundle budgets
        run: |
          npm run verify
          npm run check:renderer-bundle
          npm run check:public-site
          npm run check:brand

      - name: Rehearse backward-compatible state and revision migrations
        run: npx vitest run apps/api/src/stateMigration.test.js apps/api/src/stateArchitecture.test.js electron/accountMigration.test.js

      - name: Install isolated browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run critical production-bundle smoke paths
        run: |
          npm run e2e:management
          npm run e2e:public

      - name: Build unsigned Windows artifacts without publishing
        run: |
          npm run predist
          npm run build
          npx --no-install electron-builder --win --publish never --config.forceCodeSigning=false

      - name: Boot the packaged Electron runtime against isolated services
        run: npm run e2e:packaged

      - name: Create release evidence
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.zip', '.yml', '.blockmap' }
          $executables = $releaseFiles | Where-Object { $_.Extension -eq '.exe' }
          if (-not $executables) { throw 'No Windows executable was produced.' }
          $releaseFiles | ForEach-Object { "$(Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName | Select-Object -ExpandProperty Hash)  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
          @{
            sourceSha = '${{ inputs.source_sha }}'
            version = '${{ inputs.release_version }}'
            reason = '${{ inputs.release_reason }}'
            channel = '${{ inputs.release_channel }}'
            rollbackOf = '${{ inputs.rollback_of }}'
            workflowRun = '${{ github.run_id }}'
            workflowAttempt = '${{ github.run_attempt }}'
          } | ConvertTo-Json | Set-Content release/release-metadata.json

      - name: Attest executables and archives
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.exe
            release/*.zip

      - name: Name immutable workflow artifact
        id: artifact
        shell: pwsh
        run: "Add-Content -Path $env:GITHUB_OUTPUT -Value 'name=Orbit-${{ inputs.release_version }}-${{ inputs.source_sha }}-${{ github.run_attempt }}'"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          overwrite: false
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
            release/SHA256SUMS.txt
            release/release-metadata.json

  promote:
    name: Explicitly promote verified artifact
    if: ${{ inputs.promote }}
    needs: verify-and-package
    runs-on: windows-2025
    environment: production-release
    permissions:
      contents: write
      id-token: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Download the exact verified artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-and-package.outputs.artifact-name }}
          path: release-candidate

      - name: Reverify checksums
        shell: pwsh
        run: |
          Push-Location release-candidate
          foreach ($line in Get-Content SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9A-F]{64})  (.+)$') { throw "Malformed checksum line: $line" }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $Matches[2]).Hash -ne $Matches[1]) { throw "Checksum mismatch for $($Matches[2])." }
          }
          Pop-Location

      - name: Promote as an immutable GitHub release
        shell: pwsh
        run: |
          $notes = "Verified promotion from ${{ inputs.source_sha }}. Channel: ${{ inputs.release_channel }}. Reason: ${{ inputs.release_reason }}. Rollback of: ${{ inputs.rollback_of }}."
          $assets = Get-ChildItem release-candidate -File | Select-Object -ExpandProperty FullName
          if (-not $assets) { throw 'The verified release candidate is empty.' }
          $arguments = @('release', 'create', "v${{ inputs.release_version }}") + $assets + @('--repo', '${{ github.repository }}', '--target', '${{ inputs.source_sha }}', '--title', "Orbit ${{ inputs.release_version }}", '--notes', $notes)
          if ('${{ inputs.release_channel }}' -eq 'canary') { $arguments += '--prerelease' }
          gh @arguments
