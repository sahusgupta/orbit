name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: orbit-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      ORBIT_API_URL: http://127.0.0.1:9
      VITE_ENABLE_FIREBASE_SYNC: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            player-app/package-lock.json
            player-web/package-lock.json
            apps/api/package-lock.json
      - name: Pin npm and verify the exact toolchain
        run: |
          npm install --global npm@10.9.2
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --prefix player-app
      - name: Verify the standalone Player dependency graph
        run: |
          npm run check:independent-locks
          npm run player:expo:check
          npm run player:expo:doctor
      - run: npm ci
      - run: npm ci --prefix player-web
      - run: npm ci --prefix apps/api
      - run: npm run check:independent-locks
      - run: npm run security:paths
      - run: npm run security:dependencies
      - run: npm run check:release-controls
      - run: npm run audit:module-graph
      - run: npm run verify
      - run: npm run check:renderer-bundle
      - run: npm run check:public-site
      - run: npm run check:brand
      - name: Verify the conservative Player release config and source contract
        run: |
          npm run player:release:verify
          npx vitest run scripts/player-release-config.test.js scripts/player-release-environment.test.js scripts/verify-player-assets.test.js
          npm run player:config:verify
      - name: Export and scan the production iOS JavaScript bundle
        run: npm run player:export:ios
      - name: Generate and inspect the unsigned managed iOS project
        run: npm run player:prebuild:ios
      - name: Exercise Firestore rules against an isolated emulator
        run: npm run test:firestore-rules
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:management
      - run: npm run e2e:public
      - run: npm run web:e2e

  player-web-lockfile-probe:
    name: Player Web lockfile probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Pin npm and generate the host-native lockfile
        run: |
          npm install --global npm@10.9.2
          rm player-web/package-lock.json
          npm install --package-lock-only --ignore-scripts --include=optional --prefix player-web
      - uses: actions/upload-artifact@v4
        with:
          name: player-web-lock-${{ matrix.os }}
          path: player-web/package-lock.json
          if-no-files-found: error
