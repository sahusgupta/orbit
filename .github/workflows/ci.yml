name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            player-app/package-lock.json
            apps/api/package-lock.json
      - run: npm ci
      - run: npm ci --prefix player-app
      - run: npm ci --prefix apps/api
      - run: npm run security:paths
      - run: npm run verify
      - run: npm run check:renderer-bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:management
