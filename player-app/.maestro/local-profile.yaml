appId: com.caminuslabs.orbit
name: Fresh account choices, adult gate, and credentials without authentication
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible: Find your next game
    timeout: 30000
- assertVisible: Create account
- assertVisible: Try demo account
- assertVisible: Already have an account? Sign in
- takeScreenshot: 01-first-launch
- tapOn: Create account
- tapOn: Your name
- inputText: Release Reviewer
- assertVisible:
    id: delete
- swipe:
    start: 5%, 35%
    end: 5%, 20%
    duration: 400
- assertNotVisible:
    id: delete
- assertNotVisible:
    id: space
- assertVisible: Release Reviewer
- scrollUntilVisible:
    element: Continue
    direction: DOWN
- assertVisible:
    text: Continue
    enabled: true
- tapOn: Continue
- tapOn: you@example.com
- inputText: release.qa@example.invalid
- assertVisible:
    id: delete
- swipe:
    start: 5%, 35%
    end: 5%, 20%
    duration: 400
- assertNotVisible:
    id: delete
- assertNotVisible:
    id: space
- assertVisible: release.qa@example.invalid
- scrollUntilVisible:
    element: Continue
    direction: DOWN
- assertVisible:
    text: Continue
    enabled: true
- tapOn: Continue
- assertVisible: Phone Number
- tapOn: Continue
- assertVisible: Home Area
- scrollUntilVisible:
    element: Continue to account
    direction: DOWN
- assertVisible:
    text: Continue to account
    enabled: false
- takeScreenshot: 02-age-gate
- scrollUntilVisible:
    element: I confirm that I am 18 or older
    direction: UP
- tapOn: I confirm that I am 18 or older
- scrollUntilVisible:
    element: Continue to account
    direction: DOWN
- assertVisible:
    text: Continue to account
    enabled: true
- tapOn: Continue to account
- assertVisible: Create your account
- assertVisible: release.qa@example.invalid
- assertVisible: Account password or passphrase
- assertVisible:
    text: Create account / sign in
    enabled: false
- assertNotVisible: Account connected
- takeScreenshot: 03-account-credentials
- pressKey: Home
- launchApp:
    stopApp: false
- assertVisible: Create your account
- assertVisible: release.qa@example.invalid
- assertNotVisible: Account connected
- stopApp
- launchApp
- extendedWaitUntil:
    visible: Find your next game
    timeout: 30000
- assertVisible: Create account
- assertVisible: Try demo account
- assertNotVisible: Release Reviewer
- assertNotVisible: Account connected
- takeScreenshot: 04-cold-welcome
